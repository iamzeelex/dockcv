# Stopwords for job posting keyword analysis in DockCV.
#
# Words that job postings are made of rather than about.
# Adding or refining stopwords is editing this file — leaving Rust code
# clean of hardcoded language tables.

# Document chrome words (headings and section names) that should not be scored as terms
sections = [
  "profile",
  "summary",
  "work",
  "experience",
  "education",
  "skill",
  "certificate",
  "certification",
  "organization",
  "volunteer",
  "project",
  "publication",
]

