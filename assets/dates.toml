# Multilingual date and calendar vocabulary for DockCV.
#
# Contains month names, abbreviations, grammatical/declension variants,
# and open-ended range markers ("Present", "Heute", "настоящее время")
# for all supported languages.
#
# Adding or refining language date words is editing this file — no Rust code changes.

[en]
present = ["Present", "present", "current", "ongoing", "now", "to date", "till now"]
months_long = [
  "January", "February", "March", "April", "May", "June",
  "July", "August", "September", "October", "November", "December"
]
months_short = [
  "Jan", "Feb", "Mar", "Apr", "May", "Jun",
  "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"
]
extra_month_names = [
  { month = 9, names = ["sept"] }
]

[de]
present = ["Heute", "heute", "aktuell", "laufend", "derzeit", "zurzeit"]
months_long = [
  "Januar", "Februar", "März", "April", "Mai", "Juni",
  "Juli", "August", "September", "Oktober", "November", "Dezember"
]
months_short = [
  "Jan", "Feb", "Mär", "Apr", "Mai", "Jun",
  "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"
]
extra_month_names = [
  { month = 1, names = ["jän", "jäner"] },
  { month = 2, names = ["febr"] },
  { month = 3, names = ["maerz"] }
]

