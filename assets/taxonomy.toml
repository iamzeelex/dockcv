[contact]
# Not a section: its lines are the profile's own fields — email, phone,
# location, links. Routed into `basics`, never into a section of entries.
en = ["contact", "contact details", "contact information", "get in touch", "details"]
ru = ["контакты", "контактная информация", "связаться"]
de = ["kontakt", "kontaktdaten"]
fr = ["contact", "coordonnées"]
es = ["contacto", "datos de contacto"]
it = ["contatti", "contatto"]
pt = ["contato", "contactos"]
nl = ["contact", "contactgegevens"]
pl = ["kontakt", "dane kontaktowe"]

# ---------------------------------------------------------------------------
# Families with no built-in shape. Each becomes a custom section, under the
# title the document used.
#
# A name belongs to exactly one family — `no_name_belongs_to_two_families`
# enforces it. A name in two families is a tie the ranking cannot break, and the
# winner then falls out of map order rather than out of any stated rule. That is
# why `courses` is not a family of its own: a completed course has a name, an
# issuer and a date, which is exactly `Certificate`, and listing it twice made
# `Kurse` resolve differently from `Weiterbildung`.
# ---------------------------------------------------------------------------

