en = ["certif", "certificate", "certificates", "license", "licenses", "courses", "coursework", "training", "professional development", "continuing education"]
ru = ["сертификаты", "лицензии", "курсы", "повышение квалификации", "дополнительное образование"]
de = ["zertifikate", "zertifizierungen", "lizenzen", "kurse", "weiterbildung", "fortbildung"]
fr = ["certifications", "certificats", "licences", "formations", "cours"]
es = ["certificaciones", "certificados", "licencias", "cursos", "formación complementaria"]
