# Multilingual section taxonomy for the DockCV importer.
#
# Each `[table]` is a **section family**: one heading, named in as many
# languages as we know it by.
#
# Six family names route to a built-in section of the model — `work`,
# `education`, `skills`, `certificates`, `volunteer`, `summary`. Every other
# family is a heading we *recognise* but have no built-in shape for, and it
# becomes a custom section (D-9) keeping its own title. That is why `projects`
# is its own family below and no longer a synonym for `work`: a Projects
# section is not a job history, and filing it as one appended three projects to
# somebody's last employer.
#
# Adding a family is editing this file — no Rust changes. An unrecognised
# heading is still imported: a line set in capitals is treated as a heading on
# shape alone. The taxonomy only improves recall for title-case headings.

[work]
en = ["work", "experience", "employment", "career", "professional experience", "work history", "relevant experience"]
ru = ["опыт работы", "карьера", "профессиональный опыт", "места работы"]
de = ["berufserfahrung", "beruflicher werdegang", "arbeitserfahrung", "tätigkeiten"]
fr = ["expérience professionnelle", "parcours professionnel", "expériences"]
es = ["experiencia laboral", "experiencia profesional", "historial laboral"]
it = ["esperienza professionale", "esperienze lavorative", "percorso professionale"]
pt = ["experiência profissional", "histórico profissional"]
nl = ["werkervaring", "professionele ervaring"]
pl = ["doświadczenie zawodowe", "historia zatrudnienia"]

