# cargo-deny — supply-chain policy for the CI job of the same name.
#
# Three questions it answers that nothing was asking before: does anything in
# the graph carry a published advisory, does anything carry a licence DockCV
# cannot ship, and does anything come from a registry we did not intend.

[advisories]
# `cargo audit` in CI covers advisories too; this keeps deny's own view strict
# rather than deferring, so a yanked-but-unadvised crate still shows up.
yanked = "deny"
ignore = []

[licenses]
# DockCV ships a binary, so anything copyleft-by-linking is a problem, and
# anything unlicensed is a bigger one. The allow-list is the set actually
# present today plus the obvious neighbours; a new licence entering the graph
# should be a decision, not a surprise.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",              # Lucide
    "OFL-1.1",          # every bundled font
    "MPL-2.0",          # file-level copyleft; fine for an unmodified dependency
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# gpui and gpui_platform come from Zed's repository, pinned by Cargo.lock rather
# than by `rev` in the manifest — see the "Version coupling" note in
# crates/ui-components/THIRD_PARTY.md for why an explicit rev breaks the build.
allow-git = ["https://github.com/zed-industries/zed"]
