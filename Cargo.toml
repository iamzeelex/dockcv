[workspace]
members = [".", "crates/dockcv-core", "crates/dockcv-wasm", "crates/ui-components"]
resolver = "2"

# The browser module, built for size rather than speed — the download is the
# cost a visitor actually pays, and a one-page CV compiles in milliseconds
# either way. A profile of its own because the app wants the opposite: it keeps
# its symbols for readable crash reports (see `[profile.release]`), which a web
# page has no use for.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zeelex/dockcv"
publish = false

[package]
name = "dockcv"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "DockCV — a cross-platform desktop app built with GPUI"
default-run = "dockcv"

[[bin]]
name = "dockcv"
path = "src/main.rs"

[dependencies]
# Already in the tree via GPUI, which logs its font, asset and renderer
# problems through it — taking it directly adds no crate and lets one global
# logger capture ours and GPUI's alike. See `src/logging.rs`.
log = "0.4"
dockcv-core = { path = "crates/dockcv-core" }
dockcv-ui-components = { path = "crates/ui-components" }
gpui = { git = "https://github.com/zed-industries/zed" }

# The Typst pipeline moved to `dockcv-core`; what stays here is the last step
# of it. `render.rs` turns the engine's pixmap into a `gpui::RenderImage`, and
# these two are pinned to match what gpui itself uses so `image::Frame` and
# `SmallVec` unify to a single version and can be handed to it directly.
image = "0.25"
smallvec = "1"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.8"
# PDF text extraction, pure Rust. Deliberately *not* `pdfium-render`: that binds
# to a libpdfium the app does not ship, so import died at runtime on any machine
# without one — see the note in src/import/engines/pdf.rs.
pdf-extract = "0.12"
docx-rs = "0.4"
regex = "1.10"
serde_json = "1"
zip = "5"
csv = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

# `gpui_platform` selects the windowing/rendering backend. Features differ per
# OS, so it is declared per target rather than once with the union of features.

# macOS — primary platform. font-kit gives system font discovery; rendering is
# Metal via the default backend.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }

# Linux / FreeBSD — enable both windowing backends; the right one is chosen at
# runtime depending on the session (Wayland preferred, X11 fallback).
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11"] }

# Windows — default features; DirectX rendering and system fonts are built in.
[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed" }

[dev-dependencies]
# The same crate, with its fixture switched on. Dev-only, so `cargo test` can
# build a document out of the sample résumé and `cargo build` still ships
# without one — verified by the string sweep in `scripts/bundle.sh`.
dockcv-core = { path = "crates/dockcv-core", features = ["fixtures"] }
# Tests only — used to *build* a malformed PDF, so the guard against
# `pdf-extract`'s panics is proven against a real file rather than asserted.
# Flags mirror `pdf-extract`'s own request exactly (`default-features = false`,
# `wasm_js`) so this resolves to the identical build already in the graph and
# adds no crates: lopdf's default features would drag in chrono, jiff, rayon
# and time.
lopdf = { version = "0.42", default-features = false, features = ["wasm_js"] }

[profile.dev]
# GPUI's dependency tree is large; optimizing deps keeps the dev binary usable
# while leaving our own crate unoptimized for fast iteration.
opt-level = 0
# Full DWARF for ~1000 crates is what made `target/` 51 GB on its own. Line
# tables keep every backtrace readable — file and line for each frame, which is
# all a panic report needs — and cost a fraction of the disk. Step-debugging
# variable values needs `debug = true` back; almost nothing here is debugged
# that way, and it is one line to flip when something is.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
# Dependencies are not what anyone is debugging, and this is the bulk of it.
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
# DWARF goes; the symbol table stays. The old setting was `symbols`, on the
# grounds that nothing in the release path read them — true until `logging`
# started capturing a backtrace on panic, which without symbols is a column of
# hex addresses and with them names `dockcv::main`. Measured, because "it is
# only a few MB" is how a download gets rude: 58.0 → 65.1 MB unpacked, 30.0 →
# 32.5 MB in the .dmg. Two and a half megabytes for a crash report that says
# where it crashed.
strip = "debuginfo"
