name: Release Build & Publish

# Fires on a version tag. The tag is the instruction to publish; everything
# below refuses to publish something that disagrees with it.
on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag says what version this is. The manifest and the changelog say it
  # too, and the three drifted apart once already — the app reported 0.1.0
  # while the changelog announced 0.2.0 — so the release stops before it
  # builds anything if they still disagree.
  verify-version:
    name: Tag, manifest and changelog agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Manifest matches CHANGELOG
        run: bash scripts/release.sh --check
      - name: …and the tag matches the manifest
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="dockcv"))')"
          if [[ "$TAG" != "$MANIFEST" ]]; then
            echo "tag v$TAG does not match manifest version $MANIFEST" >&2
            exit 1
          fi
          echo "releasing $MANIFEST"

  # The file the app's update check reads, published as an asset of the
  # release it describes. A static file rather than the GitHub API: the API is
  # rate limited, shaped by someone else, and answers with far more than is
  # being asked. This answers exactly the question, and `update.rs` needs no
  # credentials, no headers and no query string to ask it.
  #
  # Its own job, so the feed does not depend on a platform build succeeding —
  # and it carries nothing but three strings, none of them about anybody.
  feed:
    name: Version feed
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Write latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > latest.json <<JSON
          {
            "version": "$VERSION",
            "published": "$(date -u +%Y-%m-%d)",
            "page": "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          }
          JSON
          cat latest.json

      - uses: softprops/action-gh-release@v2
        with:
          files: latest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS gets the real thing: scripts/bundle.sh is what produces a .app a
  # person can double-click — Info.plist, icon, and the licence notices that
  # THIRD-PARTY-NOTICES.md and the OFL both require to travel with the
  # binary. The workflow used to tar up the bare executable instead, which is
  # not an application on this platform and carried none of those files.
  macos:
    name: macOS bundle
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      # The icon is rasterised from assets/icon.svg. Without it bundle.sh
      # carries on and ships the generic application icon, which is not
      # something a release should do quietly.
      - name: Install librsvg (app icon)
        run: brew install librsvg

      - name: Build DockCV.app and the disk image
        run: ./scripts/bundle.sh --dmg

      # Named for what it is. The bundle is ad-hoc signed and not notarised
      # (no Apple Developer ID), so HOW-TO-OPEN.txt ships beside it as the
      # text for the download page — it is the difference between a first
      # launch someone can get through and one they give up on.
      - name: Name the artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="$(lipo -archs dist/DockCV.app/Contents/MacOS/dockcv | tr ' ' '-')"
          mv "dist/DockCV-$VERSION.dmg" "dist/DockCV-$VERSION-macos-$ARCH.dmg"
          echo "artifact=dist/DockCV-$VERSION-macos-$ARCH.dmg" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.artifact }}
            dist/HOW-TO-OPEN.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Linux and Windows are build-checked but untested (CLAUDE.md), so they ship
  # as an archive of the binary rather than as an installer that would imply
  # more support than exists. The licence files go in regardless: they are a
  # condition of distributing the binary, not a nicety.
  portable:
    name: ${{ matrix.label }}
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux archive
            binary: dockcv
          - os: windows-latest
            label: Windows archive
            binary: dockcv.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      # --locked, because the whole gpui pinning story rests on Cargo.lock
      # (see THIRD_PARTY.md): a free resolve here would publish a build
      # against a gpui no test ever ran on.
      - name: Build Release
        run: cargo build --release --locked --workspace

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="dockcv-$VERSION-linux-x86_64"
          mkdir "$STAGE"
          cp "target/release/${{ matrix.binary }}" "$STAGE/"
          cp LICENSE LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md "$STAGE/"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          echo "artifact=$STAGE.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $stage = "dockcv-$version-windows-x86_64"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/release/${{ matrix.binary }}" $stage
          Copy-Item LICENSE,LICENSE-MIT,LICENSE-APACHE,THIRD-PARTY-NOTICES.md $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          "artifact=$stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.artifact }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
