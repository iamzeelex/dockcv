name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Clippy Linting
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Unit & Integration Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace

  # The engine is portable on purpose (docs/research/wasm-web-demo.md) and
  # nothing in an ordinary desktop build would notice it stopping: one
  # `std::fs` in the model, one clock call, and the browser demo is dead
  # months before anyone tries to build it. Checked both ways, because the
  # feature that drops Typst's 9.2 MB font pack is the one a web build needs
  # and the one no other job exercises.
  wasm:
    name: Engine still builds for the browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
      - name: cargo check -p dockcv-core --target wasm32-unknown-unknown
        run: cargo check -p dockcv-core --locked --target wasm32-unknown-unknown
      - name: …and without the fallback fonts
        run: cargo check -p dockcv-core --locked --no-default-features --target wasm32-unknown-unknown
      - name: The browser shim itself
        run: cargo check -p dockcv-wasm --locked --target wasm32-unknown-unknown

  matrix:
    name: Cross-Platform Build Check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      - name: Cargo Check Workspace
        run: cargo check --workspace
