name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fmt:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  # A pull request's title becomes the squash-merge commit subject, so it is the
  # line that ends up in the history and, from there, in a changelog. Checked
  # with a regex rather than a third-party action: this is fifteen characters of
  # pattern, and a marketplace action is a supply-chain dependency with write
  # access to the repository it runs in.
  pr-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          # The pattern lives in a variable: bash treats an inline `\(` inside
          # [[ =~ ]] as a literal parenthesis, which quietly rejects every
          # scoped title. Verified against both shapes before it went in.
          RE='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9 ,/-]+\))?!?: .+'
          if [[ "$TITLE" =~ $RE ]]; then
            echo "ok: $TITLE"
          else
            echo "::error::The title should read like 'fix(import): read single-column CSVs'." >&2
            echo "Got: $TITLE" >&2
            echo "Types: feat fix docs style refactor perf test build ci chore revert" >&2
            exit 1
          fi

  version-check:
    name: Version & Changelog Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Version & CHANGELOG Consistency
        run: bash scripts/release.sh --check

  clippy:
    name: Clippy Linting
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Unit & Integration Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace

  # The desktop `test` job runs the conformance harness too, but with only the
  # three in-process readers: a developer machine has no poppler, no pdfminer
  # and no Java, and a test that needs them would be a test that is usually
  # skipped. This job installs all three and reads every exported PDF the way
  # the stacks under a large part of the ATS market read one — so a template
  # change that costs `pdftotext` or PDFBox a section heading fails here rather
  # than in somebody's application. See `docs/design/ats.md`.
  ats:
    name: A parser can still read what we export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Fetch the external extractors
        run: ./scripts/ats-tools.sh
      - name: Conformance
        run: "cargo test --bin dockcv ats:: -- --nocapture"
      # The importer's corpus needs the same tools: python-docx and docx2txt to
      # read a Word file back, and JSON Resume's own schema to settle whether
      # what we call a JSON Resume is one.
      - name: Import, round trips and the schema
        run: "cargo test --bin dockcv import:: -- --nocapture"
      - name: The table, whatever the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ats-conformance
          path: target/ats-conformance.md
          if-no-files-found: warn

  # The engine is portable on purpose (docs/research/wasm-web-demo.md) and
  # nothing in an ordinary desktop build would notice it stopping: one
  # `std::fs` in the model, one clock call, and the browser demo is dead
  # months before anyone tries to build it. Checked both ways, because the
  # feature that drops Typst's 9.2 MB font pack is the one a web build needs
  # and the one no other job exercises.
  wasm:
    name: Engine still builds for the browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
      - name: cargo check -p dockcv-core --target wasm32-unknown-unknown
        run: cargo check -p dockcv-core --locked --target wasm32-unknown-unknown
      - name: …and without the fallback fonts
        run: cargo check -p dockcv-core --locked --no-default-features --target wasm32-unknown-unknown
      - name: The browser shim itself
        run: cargo check -p dockcv-wasm --locked --target wasm32-unknown-unknown
      # The desktop clippy job runs on the host, where the raster path is on
      # and every raster-only helper is used — so it cannot see a warning that
      # only exists in the browser build. This can.
      - name: Clippy, on the target the browser actually uses
        run: cargo clippy -p dockcv-wasm --locked --target wasm32-unknown-unknown -- -D warnings

  matrix:
    name: Cross-Platform Parity & Smoke Test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # `libegl1`, not `libegl1-mesa`: the latter was a transitional package and
      # is gone from Ubuntu 24.04, which is what `ubuntu-latest` now is — the
      # first run of this job died on `Unable to locate package`. The dispatch
      # library is `libegl1`; the Mesa implementation behind it arrives with
      # `libgl1-mesa-dri`, which also carries the software rasteriser a runner
      # with no GPU falls back to.
      #
      # The graphics half of this list is what the smoke test needed and what
      # dockcv#15 needs to reproduce, and it stays: the workspace tests have
      # only ever run on Linux with it present, and finding out the hard way
      # which of them wanted a display is not this job's business today.
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            xvfb \
            mesa-vulkan-drivers \
            libgl1-mesa-dri \
            libegl1 \
            libvulkan1 \
            vulkan-tools

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      - name: Cargo Check Workspace
        run: cargo check --workspace

      - name: Run Workspace Tests
        run: cargo test --workspace

      # No smoke test on Linux. Under Xvfb the app starts, connects, and then
      # never reaches a first frame — ninety seconds of silence after three
      # lines of startup, with a Vulkan device and a surface extension both
      # present. Ruled out along the way: the apt package, the screen depth,
      # the missing xinput pointer, and the watchdog being too tight. What is
      # left is somewhere in GPUI's Linux path, and finding it is its own job:
      # iamzeelex/dockcv#15.
      #
      # What stays is what was most likely to break anyway — that DockCV builds
      # and behaves on Linux. What is honestly not covered is the first frame,
      # on the one platform of the three that cannot currently prove it.

      - name: Desktop GUI Smoke Test (Windows)
        if: runner.os == 'Windows'
        run: cargo run --locked -- --smoke-test

      - name: Desktop GUI Smoke Test (macOS)
        if: runner.os == 'macOS'
        run: cargo run --locked -- --smoke-test

