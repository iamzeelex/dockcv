# The engine, addressable from a web page.
#
# Thin on purpose: everything that knows what a résumé is lives in
# `dockcv-core`, and this crate only translates — a string in, SVG out, errors
# as `JsValue`. If a function here grows a decision about résumés, it belongs
# one crate down.
#
# Not published, and not a stable API. `ResumeDoc` still has open questions in
# `docs/OPEN.md` (D2, the language axis, L-5); versioning this before the model
# settles would make every one of them somebody else's breaking change.
[package]
name = "dockcv-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "DockCV's engine compiled for the browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No default features: `fallback-fonts` is 9.2 MB of faces a demo cannot
# reach, and `libertinus` puts back the one that matters — see that feature.
#
# `pdf` is on despite costing 0.3 MB compressed. A page that renders a CV and
# cannot hand you the file is a demo; a page that replaces "Download CV" has to
# produce the PDF, and producing it here rather than keeping a second copy on
# the server is the entire point — the file and what you see are the same
# compile, so they cannot drift apart.
dockcv-core = { path = "../dockcv-core", default-features = false, features = ["svg", "pdf", "libertinus", "fixtures"] }
wasm-bindgen = "0.2"
serde_json = "1"
toml = "0.8"

# The build profile lives in the *workspace root* as `wasm-release`: cargo
# ignores `[profile.*]` in a member manifest, silently enough that this crate
# shipped 31 MB before anyone noticed the settings were doing nothing.
