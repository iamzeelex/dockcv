[package]
name = "cv-structure-classifier"
version = "0.1.0"
edition = "2021"
description = "Deterministic raw text classifier into structured resume models (Kraton VMC)"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.36.0"
dockcv-core = { path = "../../dockcv-core", default-features = false }
serde_json = "1.0"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
strip = true

[workspace]
